name = "cardlio-pass"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
PASS_TYPE_ID = "pass.me.gruenitz.cardlio.mycard"
TEAM_ID = "9HEE4Z2498"
ORG_NAME = "cardlio"

# Per-IP rate limit for /sign (Workers Rate Limiting binding). 30 signings a
# minute per address is far above any real use of "Add to Wallet".
[[ratelimits]]
name = "SIGN_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Refund consumption reporting (src/refund.js). Create the namespace once:
#     npx wrangler kv namespace create PURCHASES
# Created 2026-10-01. Without the three IAP_* secrets /purchase and /asn
# answer 503 and the pass signer is unaffected.
[[kv_namespaces]]
binding = "PURCHASES"
id = "0e6af6ca94cb44bdab90c95066a14f5b"
