# Tells IndexNow (Bing, Yandex, Seznam…) which public pages a push changed,
# once GitHub Pages has had time to publish them. Internal files (the ones
# _config.yml excludes) and deletions are skipped; a push that changes no
# public file sends nothing. Run it by hand to resubmit every sitemap URL.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HOST: cardlio.app
      KEY: d28bddd1c6eefd93fdbe24e1c295ef42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed public URLs
        id: urls
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/*loc>//g' > urls.txt
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then before="HEAD~1"; fi
            git diff --name-only --diff-filter=AMR "$before" "${{ github.sha }}" \
              | grep -Ev '^(CLAUDE\.md|worker/|node_modules/|\.github/|_config\.yml|README\.md|[0-9a-f]{32}\.txt)' \
              | grep -E '\.(html|txt|xml|pdf)$' \
              | sed -e "s#^index\.html\$##" -e "s#^#https://$HOST/#" > urls.txt || true
          fi
          echo "count=$(wc -l < urls.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat urls.txt

      - name: Wait for GitHub Pages
        if: steps.urls.outputs.count != '0' && github.event_name == 'push'
        run: sleep 120

      - name: Notify IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          set -euo pipefail
          list=$(jq -R . urls.txt | jq -s -c .)
          body=$(jq -n -c --arg host "$HOST" --arg key "$KEY" --argjson urls "$list" \
            '{host:$host, key:$key, keyLocation:("https://"+$host+"/"+$key+".txt"), urlList:$urls}')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered HTTP $code"; cat /tmp/out || true
          case "$code" in 200|202) ;; *) exit 1 ;; esac
